<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galería</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="gallery-page">
    <img id="logo" src="assets/tec-logo.png" alt="Tecnológico de Monterrey" />

    <div class="gallery">
      <img class="gallery-img" src="assets/campus-1.png" alt="Campus 1" />
      <img class="gallery-img" src="assets/campus-2.png" alt="Campus 2" />
      <img class="gallery-img" src="assets/campus-3.png" alt="Campus 3" />
    </div>

    <p class="about-tec">
      El Tecnológico de Monterrey es una universidad reconocida en México por su
      enfoque en la innovación, el emprendimiento y la formación integral. A
      través de sus campus y su comunidad, impulsa proyectos académicos y
      tecnológicos que conectan el aprendizaje con retos reales.
    </p>
  </body>
</html>
